name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or situation, not just the solution.
      placeholder: When I compress large folders I can't tell how long it will take...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      placeholder: A progress bar that shows how much is done.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Workarounds you use today, other apps that do this well, screenshots, etc.
